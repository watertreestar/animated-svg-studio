<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interactive SVG network</title>
  <style>
    :root { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1E1C19; color: #FBF8F1; }
    .demo { width: min(92vw, 820px); }
    .toolbar { display: flex; align-items: center; gap: .6rem; margin-bottom: .8rem; }
    .toolbar p { margin-right: auto; }
    button { padding: .55rem .8rem; border: 1px solid #8F887D; border-radius: .6rem; background: #47423B; color: inherit; cursor: pointer; }
    svg { display: block; width: 100%; height: auto; border-radius: 1.2rem; background: #FBF8F1; }
    .edge { stroke: #D8D0C1; stroke-width: 5; transition: stroke .25s, stroke-width .25s; }
    .node { cursor: pointer; outline: none; }
    .node rect { fill: #FFFFFF; stroke: #D8D0C1; stroke-width: 2; transition: transform .25s, fill .25s, stroke .25s; transform-box: fill-box; transform-origin: center; }
    .node text { pointer-events: none; fill: #1E1C19; font: 600 17px 'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .node:hover rect, .node:focus-visible rect { transform: scale(1.04); stroke: #CF4436; }
    .node.active rect { fill: #EDE6D8; stroke: #CF4436; transform: scale(1.06); }
    .edge.active { stroke: #CF4436; stroke-width: 8; stroke-dasharray: 14 10; animation: flow .65s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) {
      .edge, .node rect { transition: none; }
      .edge.active { animation: none; stroke-dasharray: none; }
    }
  </style>
</head>
<body>
  <div class="demo">
    <div class="toolbar">
      <p id="message">Choose a service node.</p>
      <button id="replay" type="button">Replay sequence</button>
      <button id="clear" type="button">Clear</button>
    </div>
    <svg viewBox="0 0 800 460" role="img" aria-labelledby="net-title net-desc" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <title id="net-title">Interactive service network</title>
      <desc id="net-desc">Select one of three service nodes to highlight its connection to the gateway.</desc>
      <path class="edge" data-edge="search" d="M360 225C300 225 280 120 210 120" fill="none"/>
      <path class="edge" data-edge="billing" d="M360 225H210" fill="none"/>
      <path class="edge" data-edge="notify" d="M360 225C300 225 280 330 210 330" fill="none"/>
      <g transform="translate(360 165)"><rect width="210" height="120" rx="24" fill="#1E1C19"/><text x="105" y="70" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">API gateway</text></g>
      <g class="node" data-node="search" tabindex="0" role="button" aria-label="Highlight search service" transform="translate(70 75)"><rect width="140" height="90" rx="18"/><text x="70" y="54" text-anchor="middle">Search</text></g>
      <g class="node" data-node="billing" tabindex="0" role="button" aria-label="Highlight billing service" transform="translate(70 180)"><rect width="140" height="90" rx="18"/><text x="70" y="54" text-anchor="middle">Billing</text></g>
      <g class="node" data-node="notify" tabindex="0" role="button" aria-label="Highlight notification service" transform="translate(70 285)"><rect width="140" height="90" rx="18"/><text x="70" y="54" text-anchor="middle">Notify</text></g>
      <text x="465" y="340" text-anchor="middle" fill="#8F887D" font-size="15">Web mode supports state, controls, pointer and keyboard input.</text>
    </svg>
  </div>
  <script>
    const nodes = [...document.querySelectorAll('.node')];
    const edges = [...document.querySelectorAll('.edge')];
    const message = document.querySelector('#message');
    const labels = {search: 'Search service selected.', billing: 'Billing service selected.', notify: 'Notification service selected.'};
    function select(name) {
      nodes.forEach(node => node.classList.toggle('active', node.dataset.node === name));
      edges.forEach(edge => edge.classList.toggle('active', edge.dataset.edge === name));
      message.textContent = labels[name] || 'Choose a service node.';
    }
    nodes.forEach(node => {
      node.addEventListener('click', () => select(node.dataset.node));
      node.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(node.dataset.node); }
      });
    });
    document.querySelector('#clear').addEventListener('click', () => select());
    document.querySelector('#replay').addEventListener('click', async () => {
      for (const name of ['search', 'billing', 'notify']) {
        select(name); await new Promise(resolve => setTimeout(resolve, 700));
      }
    });
  </script>
</body>
</html>
