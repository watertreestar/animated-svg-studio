<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title desc" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">任务执行状态</title><desc id="desc">一个智能体正在检查文件、运行测试并整理结果。</desc>
  <rect width="560" height="300" rx="24" fill="#F4F7FB"/>
  <g transform="translate(118 150)" data-motion="optional"><circle r="54" fill="none" stroke="#E5ECF7" stroke-width="11"/><path d="M0-54A54 54 0 0 1 54 0" fill="none" stroke="#3267D6" stroke-width="11" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="1.2s" repeatCount="indefinite"/></path></g>
  <g transform="translate(210 98)"><text font-size="24" font-weight="700" fill="#182230">正在执行任务</text><text y="36" font-size="14" fill="#65758B">检查文件、运行测试并整理结果</text><g transform="translate(5 80)" fill="#3267D6"><circle r="6"><animate attributeName="opacity" values="1;.25;.25;1" keyTimes="0;.33;.66;1" calcMode="discrete" dur=".9s" repeatCount="indefinite"/></circle><circle cx="26" r="6"><animate attributeName="opacity" values=".25;1;.25;.25" keyTimes="0;.33;.66;1" calcMode="discrete" dur=".9s" repeatCount="indefinite"/></circle><circle cx="52" r="6"><animate attributeName="opacity" values=".25;.25;1;.25" keyTimes="0;.33;.66;1" calcMode="discrete" dur=".9s" repeatCount="indefinite"/></circle></g><text y="126" font-size="13" fill="#238A73">后台处理不会阻塞新的消息</text></g>
</svg>
