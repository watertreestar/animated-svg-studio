<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">文档审批流程</title><desc id="desc">文档依次经过草稿、评审、修改和发布四个阶段。</desc>
  <rect width="760" height="420" rx="24" fill="#151918"/><text x="46" y="56" font-size="25" font-weight="700" fill="#F1F4EE">文档审批流程</text><text x="46" y="83" font-size="14" fill="#94A09A">稳定布局中依次强调当前阶段</text>
  <path d="M116 205H644" pathLength="1" fill="none" stroke="#3A4541" stroke-width="8" stroke-linecap="round"/><path d="M116 205H644" pathLength="1" fill="none" stroke="#6FD6A8" stroke-width="8" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;.74;.48;.22;0;0;1" keyTimes="0;.08;.24;.42;.6;.78;.93;1" dur="5s" repeatCount="indefinite"/></path>
  <g text-anchor="middle" font-size="17" fill="#0F1211"><g transform="translate(116 205)"><circle r="46" fill="#F1F4EE" stroke="#6FD6A8" stroke-width="3"/><text y="6" fill="#0F1211">草稿</text><animateTransform attributeName="transform" additive="sum" type="scale" values="1;1.12;1;1" keyTimes="0;.1;.18;1" dur="5s" repeatCount="indefinite"/></g><g transform="translate(292 205)"><circle r="46" fill="#F1F4EE" stroke="#6FD6A8" stroke-width="3"/><text y="6" fill="#0F1211">评审</text><animate attributeName="opacity" values=".4;.4;1;1;.4" keyTimes="0;.22;.3;.46;1" dur="5s" repeatCount="indefinite"/></g><g transform="translate(468 205)"><circle r="46" fill="#F1F4EE" stroke="#6FD6A8" stroke-width="3"/><text y="6" fill="#0F1211">修改</text><animate attributeName="opacity" values=".4;.4;1;1;.4" keyTimes="0;.4;.48;.64;1" dur="5s" repeatCount="indefinite"/></g><g transform="translate(644 205)"><circle r="46" fill="#F1F4EE" stroke="#6FD6A8" stroke-width="3"/><text y="6" fill="#0F1211">发布</text><animate attributeName="opacity" values=".4;.4;1;1;.4" keyTimes="0;.58;.66;.9;1" dur="5s" repeatCount="indefinite"/></g></g>
  <g transform="translate(46 320)"><rect width="668" height="56" rx="15" fill="#252B29" stroke="#3A4541"/><text x="24" y="35" font-size="15" fill="#C8D0CB">当前状态：</text><g transform="translate(106 0)" fill="#6FD6A8" font-size="15" font-weight="650"><text y="35">草稿<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.2;.24;1" dur="5s" repeatCount="indefinite"/></text><text y="35" opacity="0">评审<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.22;.28;.43;.47" dur="5s" repeatCount="indefinite"/></text><text y="35" opacity="0">修改<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.46;.61;.65" dur="5s" repeatCount="indefinite"/></text><text y="35" opacity="0">发布<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.58;.64;.91;1" dur="5s" repeatCount="indefinite"/></text></g></g>
</svg>
