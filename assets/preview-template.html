<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__TITLE__</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111315; color: #f4f5f6; }
    header { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; padding: .8rem 1rem; border-bottom: 1px solid #34383d; }
    h1 { margin: 0 auto 0 0; font-size: 1rem; font-weight: 650; }
    button { border: 1px solid #4b5158; border-radius: .55rem; padding: .48rem .72rem; background: #24282d; color: inherit; cursor: pointer; }
    button:hover { background: #30363c; }
    main { display: grid; place-items: center; padding: 1rem; }
    #stage { width: min(100%, 960px); padding: 1rem; overflow: hidden; border-radius: 1rem; background: #fff; box-shadow: 0 12px 40px #0006; }
    #stage > svg { display: block; width: 100%; height: auto; }
    body.paused #stage * { animation-play-state: paused !important; }
    body.reduce-motion #stage svg [data-motion="optional"] { display: none; }
    #status { width: 100%; min-height: 1.2em; margin: .6rem 0 0; color: #aeb5bc; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>__TITLE__</h1>
    <button id="replay" type="button">Replay</button>
    <button id="motion" type="button" aria-pressed="false">Reduce motion</button>
    <button id="copy" type="button">Copy SVG</button>
    <button id="download" type="button">Download SVG</button>
    <div id="status" role="status" aria-live="polite"></div>
  </header>
  <main><div id="stage">__SVG__</div></main>
  <script>
    const stage = document.querySelector('#stage');
    const status = document.querySelector('#status');
    const source = () => new XMLSerializer().serializeToString(stage.querySelector('svg'));
    document.querySelector('#replay').addEventListener('click', () => {
      const oldSvg = stage.querySelector('svg');
      const clone = oldSvg.cloneNode(true);
      oldSvg.replaceWith(clone);
      status.textContent = 'Animation restarted.';
    });
    document.querySelector('#motion').addEventListener('click', event => {
      const enabled = document.body.classList.toggle('reduce-motion');
      event.currentTarget.setAttribute('aria-pressed', String(enabled));
      event.currentTarget.textContent = enabled ? 'Full motion' : 'Reduce motion';
      status.textContent = enabled ? 'Optional motion hidden.' : 'Full motion restored.';
    });
    document.querySelector('#copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(source()); status.textContent = 'SVG source copied.'; }
      catch { status.textContent = 'Clipboard permission denied; use View Source.'; }
    });
    document.querySelector('#download').addEventListener('click', () => {
      const blob = new Blob([source()], {type: 'image/svg+xml'});
      const link = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: 'animation.svg'});
      link.click(); URL.revokeObjectURL(link.href); status.textContent = 'SVG downloaded.';
    });
  </script>
</body>
</html>
