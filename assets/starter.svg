<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">Animated data flow starter</title>
  <desc id="desc">A signal travels from an input node through a processor to an output node.</desc>
  <rect width="720" height="420" rx="28" fill="#FBF8F1"/>
  <path d="M180 210H540" fill="none" stroke="#D8D0C1" stroke-width="8" stroke-linecap="round"/>
  <g id="input-node" transform="translate(120 210)">
    <circle r="56" fill="#1E1C19"/>
    <text text-anchor="middle" y="7" font-size="20" fill="#FFFFFF">Input</text>
  </g>
  <g id="processor" transform="translate(360 210)">
    <rect x="-82" y="-52" width="164" height="104" rx="18" fill="#EDE6D8" stroke="#CF4436" stroke-width="3"/>
    <text text-anchor="middle" y="7" font-size="20" fill="#1E1C19">Process</text>
    <animateTransform attributeName="transform" additive="sum" type="scale" values="1;1;1.06;1" keyTimes="0;0.36;0.46;1" dur="4s" repeatCount="indefinite"/>
  </g>
  <g id="output-node" transform="translate(600 210)">
    <circle r="56" fill="#5E7F5A"/>
    <text text-anchor="middle" y="7" font-size="20" fill="#FFFFFF">Output</text>
  </g>
  <circle r="12" fill="#CF4436" data-motion="optional">
    <animate attributeName="cx" values="180;360;540" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="210;210;210" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
